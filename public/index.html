<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paradise Found Party</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Public+Sans:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Theme Toggle positioned top right -->
    <button id="themeToggle" class="btn small" style="position: absolute; top: 1rem; right: 1rem;">🌙 Dark Mode</button>

    <div id="landing" class="container">
        <h1>Welcome to Paradise Found Party</h1>
        <p>Watch videos together with your friends in perfect sync.</p>

        <div class="form-group">
            <label for="nickname">Your Nickname:</label>
            <input type="text" id="nickname" placeholder="Enter nickname" required>
        </div>

        <div class="actions">
            <div class="create-section">
                <h3>Start a new party</h3>
                <button id="createBtn" class="btn primary">Create Room</button>
            </div>

            <div class="join-section">
                <h3>Join an existing party</h3>
                <input type="text" id="joinRoomId" placeholder="Room ID">
                <button id="joinBtn" class="btn secondary">Join Room</button>
            </div>
        </div>
        <p id="errorMsg" class="error"></p>
    </div>

    <!-- The Party UI will be injected or shown here later -->
    <div id="party" class="container hidden">
        <div class="header">
            <h2>Room: <span id="displayRoomId"></span></h2>
            <button id="leaveBtn" class="btn secondary small">Leave</button>
        </div>

        <div class="main-content">
            <div class="video-container">
                <div id="adminControls" class="hidden">
                    <h3>Provide Video for Party</h3>
                    <div style="margin-bottom: 1.5rem;">
                        <label for="videoUrlInput">1. Paste Direct URL (Google Drive, Dropbox, etc.)</label>
                        <div style="display: flex; gap: 10px; margin-top: 5px;">
                            <input type="text" id="videoUrlInput" placeholder="https://example.com/video.mp4">
                            <button id="loadUrlBtn" class="btn primary small">Load URL</button>
                        </div>
                    </div>

                    <div style="border-top: 2px dashed var(--border-color); padding-top: 1rem;">
                        <label for="videoUpload">2. Or Upload Local File (max 4GB)</label>
                        <input type="file" id="videoUpload" accept="video/mp4,video/webm,video/ogg,video/x-matroska,.mkv" style="margin-top: 5px; margin-bottom: 1rem;">
                        <button id="uploadBtn" class="btn primary">Upload & Start</button>

                        <div id="progressContainer" class="hidden">
                            <progress id="uploadProgress" max="100" value="0"></progress>
                            <span id="uploadPercent">0%</span>
                        </div>
                        <p id="uploadStatus"></p>
                    </div>
                </div>
                    <p id="uploadStatus"></p>
                </div>
                <div id="playerContainer" class="hidden">
                    <div id="videoWrapper">
                        <video id="syncPlayer" controls preload="auto"></video>
                        <button id="exitFsBtn">← Back</button>
                        <div id="chatOverlay" class="hidden"></div>
                        <div id="fastReplyContainer">
                            <input type="text" id="fsChatInput" placeholder="Fast reply...">
                            <button id="fsSendBtn" class="btn primary small">Send</button>
                        </div>
                    </div>
                    <button id="fullscreenBtn" class="btn secondary small" style="margin-top: 10px;">Toggle Fullscreen</button>
                </div>
                <div id="waitingMessage">
                    <p>Waiting for Admin to upload a video...</p>
                </div>
            </div>

            <div class="chat-container">
                <h3>Live Chat</h3>
                <div id="chatBox" class="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Type a message...">
                    <button id="sendBtn" class="btn primary">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
